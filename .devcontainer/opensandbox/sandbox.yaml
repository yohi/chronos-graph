profiles:
  lite:
    image: chronos-graph-sandbox-lite:latest
    resource_limits:
      cpu: "2"
      memory: "2Gi"
    timeout: 300
    pool:
      min_ready: 1
      max_instances: 3
      idle_timeout: 600
    egress:
      default: deny
      allow:
        - pypi.org
        - files.pythonhosted.org
        - registry.npmjs.org
    working_dir: /workspace
    mounts:
      - source: "${PROJECT_ROOT}"
        target: /workspace
        read_only: false

  integration:
    extends: lite
    egress:
      default: deny
      allow:
        - pypi.org
        - files.pythonhosted.org
        - registry.npmjs.org
        - "${TEST_DB_HOST:-host.docker.internal}"
    env:
      OPENSANDBOX: "1"
      POSTGRES_HOST: "${TEST_DB_HOST:-host.docker.internal}"
      POSTGRES_PORT: "${TEST_DB_PORT:-5435}"
      POSTGRES_DB: "${TEST_DB_NAME:-context_store_test}"
      POSTGRES_USER: "${TEST_DB_USER:-context_store}"
      # WARNING: The default fallbacks are for local development only.
      # You MUST override them in CI or production environments.
      POSTGRES_PASSWORD: "${TEST_DB_PASSWORD:-dev_password}"
      NEO4J_URI: "${TEST_NEO4J_URI:-bolt://host.docker.internal:7687}"
      # NOTE: 本体 Settings (src/context_store/config.py) は NEO4J_USER / NEO4J_PASSWORD を
      # 個別に読む。結合形式の NEO4J_AUTH は読まれないため分割して渡すこと。
      NEO4J_USER: "${TEST_NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${TEST_NEO4J_PASSWORD:-dev_password}"
      REDIS_URL: "${TEST_REDIS_URL:-redis://host.docker.internal:6379}"
