name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '30 2 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Initialize CodeQL
      uses: github/codeql-action/init@411c4c9a36b3fca4d674f06b6396b2c6d23522c6
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@411c4c9a36b3fca4d674f06b6396b2c6d23522c6

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@411c4c9a36b3fca4d674f06b6396b2c6d23522c6
      with:
        category: "/language:${{matrix.language}}"
