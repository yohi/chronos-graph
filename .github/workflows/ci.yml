name: CI

on:
  push:
    branches: ["master"]
  # NOTE: pull_request には branches フィルタを設定しない。
  # 本リポジトリは stacked PR ワークフローを採用しており、Task 2.1 / 3.1 のような
  # base=feature-branch の PR でも CI を必ず起動させるため、target branch を絞らない。
  # push は master のみに限定して masters を二重実行しない。
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra all --dev

      - name: Run Semgrep
        run: |
          uv run semgrep --config auto --error .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Run mypy
        run: uv run mypy src/

      - name: Run unit tests
        run: uv run pytest tests/unit tests/test_chronos_shared -v --cov=src/context_store --cov-report=xml
        env:
          OPENAI_API_KEY: sk-dummy-key-for-ci-validation

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Run frontend lint
        working-directory: frontend
        run: pnpm run lint

      - name: Run frontend unit tests
        working-directory: frontend
        run: pnpm run test:unit -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml,./frontend/coverage/lcov.info
          fail_ci_if_error: false

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
