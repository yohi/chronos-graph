---
# Global exclusion for dialect-specific SQL files and agent guidelines that cause false positives
exclude_paths:
  - "src/context_store/storage/migrations/sqlite/*.sql"
  - "src/context_store/storage/migrations/postgres/*.sql"
  - "AGENTS.md"
  - "tests/unit/test_integration_conftest_env.py"

engines:
  ai-inventory:
    exclude_paths:
      - "src/mcp_gateway/policy/llm_evaluator.py"
      - "src/mcp_gateway/policy/memory_client.py"
  agentlinter:
    exclude_paths:
      - "src/mcp_gateway/policy/llm_evaluator.py"
      - "src/mcp_gateway/policy/memory_client.py"
  bandit:
    exclude_paths:
      - "tests/**"
  sonarjs:
    patterns:
      - name: "S5144"
        enabled: false
  remark-lint:
    patterns:
      - name: "undefined-acronym"
        enabled: false
