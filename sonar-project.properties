# SonarCloud Project Configuration
sonar.projectKey=yohi_chronos-graph
sonar.organization=yohi
sonar.projectName=chronos-graph

# Path to source directories
sonar.sources=src,frontend/src

# Path to test directories
sonar.tests=tests,frontend/src
sonar.test.inclusions=tests/**/*.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx

# Python configuration
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# JavaScript/TypeScript configuration
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/__pycache__/**
